onnx: ???  # the exported graph; build from the fp32 export, the builder casts what it can
output: null  # null: <onnx stem>.<precision>.engine
precision: fp16  # fp32 | fp16 | bf16 (fp32 keeps TensorRT's TF32 default); io stays as in the graph
workspace_gb: 4
batch: [1, 1, 1]  # [min, opt, max] for the dynamic batch axis of visnavkit-export graphs; ignored for fixed shapes
verbose: false  # TensorRT builder log at INFO

hydra:
  job:
    chdir: false
