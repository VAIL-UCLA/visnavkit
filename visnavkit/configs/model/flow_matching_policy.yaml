# FlowMatchingPolicy (visnavkit.models.flow_matching_policy): RGB FastViT-SA12 per 20 Hz slot -> global average-pooled
# feature; [global | route VAE latent] each Linear -> LayerNorm -> causal temporal attention (past-slot drop 0.1) -> the
# temporal feature is the one kv token of StepFlowHead (flow matching from noise, one query per plan step + step
# position + ego [v, w], each ego channel hidden w.p. 0.9). Every slot with a frame is supervised. Needs pose_size 5
# targets, `ego` starting with [speed, yaw_rate] and action bounds (configs/experiment/flow_matching_policy_clips1k.yaml).
defaults:
  - action_decoder: step_flow  # s2e_anchor / flow_bridge: the anchor heads (flow_matching_policy_s2e / _bridge)
  - _self_

_target_: visnavkit.models.flow_matching_policy.FlowMatchingPolicy
dim: 256
seq_len: ${common.seq_length}
frame_encoder:
  _target_: visnavkit.models.vision.frame_encoder.FrameEncoder
  backbone_name: fastvit_sa12
  pretrained: true
temporal:
  num_layers: 2
  num_heads: 8
  dropout: 0.1
  mask_p: 0.1  # training: random past-slot drop in the causal attention
  post_norm: true
route:
  weights: null  # the frozen route VAE checkpoint (RouteEncoder, 3 classes, 80 x 80); null = random (tests only)
  num_classes: 3
