# FlowMatchingPolicy's S2EHead (visnavkit.models.action.anchor_heads): anchors in, trajectories out, one pass, no flow (FlowPilot minus flow matching).
# One mode token per k-means anchor; the top-score mode is the plan (1 per decision, deterministic).
_target_: visnavkit.models.action.anchor_heads.S2EHead
_partial_: true  # the policy passes dim
anchors_path: null  # (K, plan_len_points, 2) normalised per-step dx, dy in [0, 1] (.npy); null = random (tests only)
num_pts: ${plan_len_points}
num_layers: 4
num_heads: 8
dropout: 0.1
ego_mask_p: 0.9  # training: hide each ego channel (v, w) w.p. 0.9
