defaults:
  - dataset: null
  - optimizer: adamw
  - model: base
  - metrics: open_loop
  - ema: null  # ema=default averages the weights (recommended for generative decoders)
  - _self_
  - experiment: null

log_dir: logs
exp_name: baseline
seed: 42
strict_git: false
logger:
  _target_: lightning.pytorch.loggers.CSVLogger
  save_dir: ${log_dir}
  name: ${exp_name}
plan_len_seconds: 3
plan_len_points: 10

# Start from an existing VisNavKit checkpoint; strict=false loads only the stages that match.
pretrained:
  ckpt_path: null
  strict: true

# Photometric augmentation of train batches on the GPU (visnavkit.data.frame_augs.FrameAugment kwargs):
# color_jitter [brightness, contrast, saturation, hue] plus p_erase / p_frame_brightness / p_grayscale /
# p_blur / p_noise / p_jpeg camera degradations; pixels only, so no target changes. null = off.
augs: null

trainer:
  kwargs:
    max_epochs: 50
    devices: 1
    precision: "bf16-mixed"
    check_val_every_n_epoch: 1
    num_sanity_val_steps: 2
    log_every_n_steps: 1
  display:  # console output (visnavkit.utils.display)
    progress_bar: tqdm  # tqdm (the reference: Lightning's bar) | rich (the rich extra) | lines (plain lines, for nohup / tee) | none
    refresh_every_n_steps: 1  # tqdm / rich refresh rate; lines: steps between lines (e.g. 50)
    model_summary: lightning  # lightning (the reference: depth-1 table) | deep | rich (the rich extra) | stages | none
    summary_depth: 2  # deep / rich: module levels shown
    print_config: false  # true: print the resolved config (the run's hyperparameters) at fit start
    batch_summary: 0  # N > 0: print the first train batch (keys, shapes, ranges) and its first N windows
  logging:
    save_top_k_ckpts: 5
    # batches between image collections of log_images_num_samples windows from consecutive rank-0 batches:
    # <stage>/route ([current frame | route patch], windows with a route) and <stage>/plan (visnavkit.utils.plan_viz
    # panels: GT and the top log_images_top_k modes of an eval forward on the frame, in BEV and as v / w / yaw
    # curves; models with current_modes, needs the plot extra), logged to image-capable loggers (wandb), else
    # written to <log_dir>/images/<stage>_step<N>/; null = off
    log_images_every_n_batches: { train: null, val: null }
    log_images_num_samples: 1
    log_images_top_k: 6
    monitor: val/action_reg
    mode: min
  resume:
    ckpt_path: null

common:
  crop_xy: [0, 0]
  crop_wh: [640, 480]
  downscale_factor: 2
  seq_length: 10
  step: 1
  use_full_pose: true  # pose_size 3 -> (x, y, v) targets

  plan_len_seconds: ${plan_len_seconds}
  plan_len_points: ${plan_len_points}
  # true: t_anchors = build_idxs(plan_len_seconds, plan_len_points + 1)[1:] (no t=0 anchor)
  offset_t_anchors: false
  # true: plan_len_points anchors plan_len_seconds / plan_len_points s apart (a fixed rate), overriding offset_t_anchors
  uniform_t_anchors: false

  # Goals are sampled from the episode's own future: a frame between goal_horizon_s[0] and
  # goal_horizon_s[1] seconds after the last observed frame (point / image goals).
  goal_horizon_s: [3.0, 15.0]

  # Per-frame ego status packed into the `ego` batch entry; [] disables it. The ego encoder's
  # in_dim must match this width (speed -> 1 channel, yaw_rate -> 1 channel).
  ego_features: []

  # Read camera_intrinsics.npy / camera_extrinsics.npy sidecars and adjust K for the crop and
  # downscale; pair it with model/camera_encoder=pinhole.
  use_camera: false

  # Export VISNAVKIT_DATA_ROOT in ~/.bashrc so every config picks the corpus up by itself.
  data_root: ${oc.env:VISNAVKIT_DATA_ROOT,/data/nav_clips}
