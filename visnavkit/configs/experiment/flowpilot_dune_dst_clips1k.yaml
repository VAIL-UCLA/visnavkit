# @package _global_
# FlowPilot-DUNE-DST on clips1k: flowpilot_dst_clips1k at dim 1024 (2 temporal, 2 context self-attention, 2 DiT, every
# FFN 4 x dim; no embodiment token, goal mask 0.5,
# grad clip 5) with the frozen DUNE frame encoder (model/flowpilot_dune_dst.yaml). Pass the donor ViT:
#   model.frame_encoder.weights=<reference UnifiedModel ckpt, or the encoder's state dict extracted from it>
defaults:
  - flowpilot_dst_clips1k
  - override /model: flowpilot_dune_dst
  - _self_

exp_name: flowpilot_dune_dst_clips1k

model:
  dim: 1024  # token / temporal / context / DiT width (flowpilot_dst_clips1k: 256): 208.2M total, 113.6M trainable (DUNE ViT and route VAE frozen)
  temporal:
    num_layers: 2
  context:
    num_layers: 2
  head:
    num_layers: 2
