# @package _global_
# FlowPilot-DUNE-DST on clips1k: flowpilot_dst_clips1k at dim 512 (2 temporal, 2 DiT, no embodiment token, goal mask 0.5,
# grad clip 5) with the frozen DUNE frame encoder (model/flowpilot_dune_dst.yaml). Pass the donor ViT:
#   model.frame_encoder.weights=<reference UnifiedModel ckpt, or the encoder's state dict extracted from it>
defaults:
  - flowpilot_dst_clips1k
  - override /model: flowpilot_dune_dst
  - _self_

exp_name: flowpilot_dune_dst_clips1k

model:
  dim: 512  # token / temporal / DiT width (flowpilot_dst_clips1k: 256): 118.4M total, 23.8M trainable
