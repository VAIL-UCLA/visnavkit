# @package _global_
# FlowPilot-DST tiny on clips1k alone: flowpilot_dst_tiny with the clips1k rows of the shared manifest
# (val.txt is clips1k already). Write the train manifest once in data_root:
#   grep "/clips1k/" train.txt > train_clips1k.txt
defaults:
  - flowpilot_dst_tiny
  - _self_

exp_name: flowpilot_dst_clips1k

model:
  dim: 256  # token / temporal / DiT width (tiny: 512): 23.3M total, 15.0M trainable
  embodiment_token: false  # one corpus: the embodiment token carries nothing
  temporal_reg_weight: 0.2  # aux single-mode plan on the temporal feature (the reference's anchor-free branch: 0.2)
  goal_mask_p: 0.5  # training: the learned empty-goal token w.p. 0.5 per window (the model default, pinned here)
  temporal:
    num_layers: 2  # causal self-attention over the slots
  head:
    num_layers: 2  # DiT blocks: cross-attention to the per-frame spatial tokens

optimizer:
  max_grad_norm: 5.0  # clip the total grad norm

dataset:
  train_loader:
    file_list: train_clips1k.txt
