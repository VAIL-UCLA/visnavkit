defaults:
  - train
  - _self_

checkpoint: null  # null: export with untrained weights (pipeline check; parity reported, not enforced)
output: visnavkit.onnx  # + <output>.pth, .metadata.json and .inputs.npz beside it
onnx_opset_version: 14
precision: fp16  # fp32 | fp16 | bf16: the stored weight dtype, io stays fp32; a TensorRT engine computes at it
batch_size: 1  # graphs have fixed shapes
strict: null  # parity beyond the tolerance fails the export; null: for checkpoint weights only; the files are written either way
export_heads: []
graph: {}  # model-specific export_graph options: +graph.top_k=3 (window models: plans per call), +graph.noise=randn +graph.num_samples=4 (a noise input)

hydra:
  job:
    chdir: false
