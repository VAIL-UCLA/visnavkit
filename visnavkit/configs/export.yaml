defaults:
  - train
  - _self_

checkpoint: null  # null: export with untrained weights (pipeline check; parity reported, not enforced)
output: visnavkit.onnx  # + <output>.pth, .metadata.json and .inputs.npz beside it
onnx_opset_version: 14
precision: fp16  # fp32 | fp16: the stored weight dtype, io stays fp32; a TensorRT engine takes the same precision
export_heads: []

hydra:
  job:
    chdir: false
