defaults:
  - train
  - _self_

checkpoint: null  # null: untrained pipeline check
output: flowpilot_dst.onnx  # + <output>.pth, .metadata.json and .inputs.npz beside it
onnx_opset_version: 17
precision: fp32  # fp32 | fp16: the stored weight dtype, io stays fp32; a TensorRT engine takes the same precision
batch_size: 1
top_k: 6  # plans returned per call, ranked by score

hydra:
  job:
    chdir: false
