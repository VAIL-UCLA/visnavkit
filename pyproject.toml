[project]
name = "visnavkit"
version = "0.1.0"
description = "Visual navigation models, training, ONNX export, and open-loop benchmarks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy~=1.26",
  "timm>=1.0.11",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "torch==2.13.0",
  "torchvision>=0.24.0",
  "torchcodec>=0.10",
  "lightning>=2.6.1",
  "onnx>=1.17.0",
  "onnxruntime>=1.20.1",
]

[project.optional-dependencies]
dali = ["nvidia-dali-cuda130~=1.53.0; sys_platform == 'linux'"]
wandb = ["wandb>=0.26.0"]
export = ["onnxslim>=0.1.43"]
plot = ["matplotlib>=3.9.3"]
rich = ["rich>=13.0"]

[project.scripts]
visnavkit-train = "visnavkit.scripts.train:main"
visnavkit-train-route = "visnavkit.scripts.train_route:main"
visnavkit-export = "visnavkit.scripts.export:main"
visnavkit-export-dst = "visnavkit.scripts.export_dst:main"
visnavkit-benchmark = "visnavkit.scripts.benchmark:main"
visnavkit-benchmark-data = "visnavkit.scripts.benchmark_dataloader:main"
visnavkit-sanity-check = "visnavkit.scripts.sanity_check:main"
visnavkit-dataset = "visnavkit.scripts.dataset.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff==0.14.*",
  "ipykernel>=6.29.5",
  "matplotlib>=3.9.3",
]

[tool.uv]
package = true
# NOTE: torch 2.13 pins cudnn 9.20, but 9.24 has bug fixes specifically for blackwell gpus
# when we upgrade to torch 2.14 we can remove this
override-dependencies = [
  "nvidia-cudnn-cu13==9.24.0.43; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["visnavkit*"]

[tool.setuptools.package-data]
"visnavkit.configs" = ["**/*.yaml"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
